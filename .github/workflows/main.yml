name: CI for iOS (Simulator Build)

on:
  push:
    branches:
      - some-tests

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1️⃣ Получаем код
      - name: Checkout repository
        uses: actions/checkout@v2

      # 2️⃣ Показываем доступные Xcode
      - name: Show available Xcode versions
        run: |
          echo "Installed Xcode versions:"
          ls /Applications/ | grep Xcode
          echo "Active Xcode version:"
          xcodebuild -version

      # 3️⃣ Выбираем версию Xcode
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.0'

      # 4️⃣ Устанавливаем зависимости через Bundler
      - name: Install dependencies
        run: |
          bundle install --jobs 4 --retry 3
          bundle exec fastlane install_plugins --verbose || true

      # 5️⃣ Сборка и тесты для симулятора
      - name: Build and test on Simulator
        run: |
          bundle exec fastlane build_simulator
